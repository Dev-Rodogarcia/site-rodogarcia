Modulo  : Frontend - templates do painel developer
Papel   : Editor de informacoes da pagina Contato (titulos, canais, endereco e CTA).

Responsabilidades:
- Permitir atualizar texto do hero da pagina de contato.
- Permitir atualizar telefone, e-mail, WhatsApp e endereco exibidos no site.
- Permitir editar CTA principal sem alterar HTML/CSS da pagina.

Integracoes:
- Dependencias: /developer/js/managers/contact-manager.js
- Endpoints/rotas: nao se aplica neste template.
- Classes/seletores/chaves: #contato-info-form, #contactPageTitle, #contactPhoneNumber, #contactEmailAddress, #contactWhatsappUrl

Entradas e saidas:
- Entradas: dados de formulario fornecidos pelo usuario do CMS.
- Saidas  : estrutura de formulario para leitura/escrita via manager.

Elementos tecnicos: arquivo declarativo, sem funcoes JS locais.
[DOC-FILE-END]============================================================== -->

<section class="panel-card">
  <h2>Contato / Informacoes de contato</h2>
  <p>Atualize os canais oficiais da empresa e o CTA principal da pagina.</p>
  <p class="field-hint mt-10">
    Mapa rapido: os dados abaixo aparecem em <strong>/fale-conosco.html</strong> nos blocos Hero, Canais de atendimento, Endereco da matriz e CTA final.
  </p>

  <form id="contato-info-form" class="form-section mt-14" novalidate>
    <div class="form-grid two-col">
      <label class="form-field">
        <span>Titulo da pagina</span>
        <input id="contactPageTitle" name="contactPageTitle" type="text" maxlength="120" required>
        <small class="field-hint">Vai para: Hero da pagina de contato - titulo principal.</small>
      </label>
      <label class="form-field">
        <span>Subtitulo da pagina</span>
        <input id="contactPageSubtitle" name="contactPageSubtitle" type="text" maxlength="280" required>
        <small class="field-hint">Vai para: Hero da pagina de contato - subtitulo.</small>
      </label>
    </div>

    <div class="form-grid two-col">
      <label class="form-field">
        <span>Telefone</span>
        <input id="contactPhoneNumber" name="contactPhoneNumber" type="text" maxlength="60" required>
        <small class="field-hint">Vai para: Canais de atendimento - card Telefone - linha "Numero".</small>
      </label>
      <label class="form-field">
        <span>Horario do telefone</span>
        <input id="contactPhoneHours" name="contactPhoneHours" type="text" maxlength="120" required>
        <small class="field-hint">Vai para: Canais de atendimento - card Telefone - linha "Horario".</small>
      </label>
    </div>

    <div class="form-grid two-col">
      <label class="form-field">
        <span>E-mail</span>
        <input id="contactEmailAddress" name="contactEmailAddress" type="email" maxlength="160" required>
        <small class="field-hint">Vai para: Canais de atendimento - card E-mail - endereco + link "Enviar e-mail".</small>
      </label>
      <label class="form-field">
        <span>Retorno do e-mail</span>
        <input id="contactEmailResponse" name="contactEmailResponse" type="text" maxlength="120" required>
        <small class="field-hint">Vai para: Canais de atendimento - card E-mail - linha "Retorno".</small>
      </label>
    </div>

    <div class="form-grid two-col">
      <label class="form-field">
        <span>WhatsApp (URL completa)</span>
        <input id="contactWhatsappUrl" name="contactWhatsappUrl" type="url" required>
        <small class="field-hint">Vai para: Canais de atendimento - card WhatsApp - botao "Abrir WhatsApp".</small>
      </label>
      <label class="form-field">
        <span>Rotulo do WhatsApp</span>
        <input id="contactWhatsappLabel" name="contactWhatsappLabel" type="text" maxlength="80" required>
        <small class="field-hint">Vai para: Canais de atendimento - card WhatsApp - linha "Canal".</small>
      </label>
    </div>

    <div class="form-grid two-col">
      <label class="form-field">
        <span>Endereco</span>
        <input id="contactAddressLine" name="contactAddressLine" type="text" maxlength="180" required>
        <small class="field-hint">Vai para: Endereco da matriz - linha "Endereco".</small>
      </label>
      <label class="form-field">
        <span>CEP</span>
        <input id="contactAddressZip" name="contactAddressZip" type="text" maxlength="20" required>
        <small class="field-hint">Vai para: Endereco da matriz - linha "CEP".</small>
      </label>
    </div>

    <div class="form-grid two-col">
      <label class="form-field">
        <span>Pais</span>
        <input id="contactAddressCountry" name="contactAddressCountry" type="text" maxlength="60" required>
        <small class="field-hint">Vai para: Endereco da matriz - linha "Pais".</small>
      </label>
      <label class="form-field">
        <span>CTA principal (texto)</span>
        <input id="contactCtaLabel" name="contactCtaLabel" type="text" maxlength="40" required>
        <small class="field-hint">Vai para: CTA final da pagina - texto do botao principal.</small>
      </label>
    </div>

    <label class="form-field">
      <span>CTA principal (link)</span>
      <input id="contactCtaUrl" name="contactCtaUrl" type="url" required>
      <small class="field-hint">Vai para: CTA final da pagina - link do botao principal.</small>
    </label>

    <div class="form-actions">
      <button class="btn-primary" type="submit">Salvar contato</button>
    </div>
  </form>
</section>
