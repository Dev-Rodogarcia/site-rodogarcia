<section class="panel-grid two-col">
  <article class="panel-card">
    <h2>Servicos / Feedbacks</h2>
    <p>Gerencie depoimentos de clientes sem mexer na estrutura da pagina.</p>

    <form id="feedback-form" class="form-section mt-14" novalidate>
      <input id="feedbackId" name="feedbackId" type="hidden">

      <div class="form-grid two-col">
        <label class="form-field">
          <span>Nome</span>
          <input id="feedbackName" name="feedbackName" type="text" maxlength="80" required>
        </label>
        <label class="form-field">
          <span>Cargo</span>
          <input id="feedbackRole" name="feedbackRole" type="text" maxlength="80" required>
        </label>
      </div>

      <label class="form-field">
        <span>Empresa</span>
        <input id="feedbackCompany" name="feedbackCompany" type="text" maxlength="120" required>
      </label>

      <label class="form-field">
        <span>Comentario</span>
        <textarea id="feedbackComment" name="feedbackComment" maxlength="800" required></textarea>
      </label>

      <label class="form-field">
        <span>Foto (opcional - URL)</span>
        <input id="feedbackPhoto" name="feedbackPhoto" type="url">
      </label>

      <label class="check-field">
        <input id="feedbackActive" name="feedbackActive" type="checkbox" checked>
        Feedback ativo
      </label>

      <div class="form-actions">
        <button class="btn-primary" type="submit">Salvar feedback</button>
        <button class="btn-secondary" type="button" id="feedback-clear-btn">Limpar</button>
      </div>
    </form>
  </article>

  <article class="panel-card">
    <h3>Feedbacks cadastrados</h3>
    <ul id="feedback-list" class="entity-list mt-10"></ul>
  </article>
</section>
