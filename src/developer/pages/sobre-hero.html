- Disponibilizar ids de formulario para o manager de Sobre salvar os dados.

Integracoes:
- Dependencias: /developer/js/managers/about-manager.js

- Entradas: texto/imagem digitados no formulario.

<section class="panel-card">
  <h2>Sobre Nos / Hero institucional</h2>
  <p>Edite somente os campos permitidos no topo da pagina Sobre Nos.</p>

  <form id="sobre-hero-form" class="form-section mt-14" novalidate>
    <div class="form-grid two-col">
      <label class="form-field">
        <span>Tag</span>
        <input id="aboutHeroTag" name="aboutHeroTag" type="text" maxlength="60" required>
      </label>
      <label class="form-field">
        <span>Imagem (URL)</span>
        <input id="aboutHeroImage" name="aboutHeroImage" type="url" required>
      </label>
    </div>

    <label class="form-field">
      <span>Titulo principal</span>
      <input id="aboutHeroTitle" name="aboutHeroTitle" type="text" maxlength="140" required>
    </label>

    <label class="form-field">
      <span>Subtitulo</span>
      <textarea id="aboutHeroSubtitle" name="aboutHeroSubtitle" maxlength="320" required></textarea>
    </label>

    <h3 class="section-subtitle">Numeros em destaque</h3>

    <div class="form-grid two-col">
      <label class="form-field">
        <span>Numero 1</span>
        <input id="aboutStat1Number" name="aboutStat1Number" type="text" maxlength="20" required>
      </label>
      <label class="form-field">
        <span>Descricao 1</span>
        <input id="aboutStat1Description" name="aboutStat1Description" type="text" maxlength="80" required>
      </label>
    </div>

    <div class="form-grid two-col">
      <label class="form-field">
        <span>Numero 2</span>
        <input id="aboutStat2Number" name="aboutStat2Number" type="text" maxlength="20" required>
      </label>
      <label class="form-field">
        <span>Descricao 2</span>
        <input id="aboutStat2Description" name="aboutStat2Description" type="text" maxlength="80" required>
      </label>
    </div>

    <div class="form-grid two-col">
      <label class="form-field">
        <span>Numero 3</span>
        <input id="aboutStat3Number" name="aboutStat3Number" type="text" maxlength="20" required>
      </label>
      <label class="form-field">
        <span>Descricao 3</span>
        <input id="aboutStat3Description" name="aboutStat3Description" type="text" maxlength="80" required>
      </label>
    </div>

    <div class="form-actions">
      <button class="btn-primary" type="submit">Salvar Sobre Nos</button>
    </div>
  </form>
</section>
