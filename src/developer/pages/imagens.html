<section class="panel-grid two-col">
  <article class="panel-card">
    <h2>Gerenciar Imagens do Site</h2>
    <p>Envie imagens para `/public/uploads`: o sistema ajusta automaticamente tamanho/qualidade para ate 2MB antes do envio.</p>

    <form id="image-upload-form" class="form-section mt-14" novalidate>
      <label class="form-field">
        <span>Selecionar arquivo</span>
        <input id="imageFile" name="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required>
      </label>

      <div class="image-preview-wrap">
        <img id="image-preview" alt="Preview da imagem selecionada" hidden>
        <p id="image-preview-empty">Selecione uma imagem para visualizar preview.</p>
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit">Upload da imagem</button>
      </div>
    </form>

    <hr class="separator">

    <h3>Substituir referencias de imagem no conteudo</h3>
    <form id="image-replace-form" class="form-section mt-12" novalidate>
      <label class="form-field">
        <span>URL atual</span>
        <input id="fromImageUrl" name="fromImageUrl" list="image-url-options" type="text" required>
      </label>
      <label class="form-field">
        <span>Nova URL</span>
        <input id="toImageUrl" name="toImageUrl" list="image-url-options" type="text" required>
      </label>
      <datalist id="image-url-options"></datalist>

      <div class="form-actions">
        <button class="btn-secondary" type="submit">Substituir no Hero, DNA e Sobre</button>
      </div>
    </form>
  </article>

  <article class="panel-card">
    <h3>Biblioteca de imagens</h3>
    <ul id="image-grid" class="image-grid mt-10"></ul>
  </article>
</section>
