<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Criar Conta | Funcionarios e Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-body" data-page="register">
  <main class="auth-card" aria-label="Formulario de cadastro">
    <h1>Criar conta interna</h1>
    <p class="auth-subtitle">Cadastro controlado para funcionarios e equipe de desenvolvimento.</p>
    <p id="auth-notice" class="auth-notice">Cadastro permitido apenas com controle administrativo.</p>

    <p id="auth-message" class="auth-message" aria-live="polite"></p>

    <form id="register-form" class="auth-form" novalidate>
      <div class="auth-field">
        <label for="name">Nome completo</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="auth-field">
        <label for="email">E-mail corporativo</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="auth-field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
      </div>

      <div class="auth-field">
        <label for="confirmPassword">Confirmar senha</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
      </div>

      <div class="auth-field" id="setup-code-wrapper" hidden>
        <label for="setupCode">Codigo inicial do servidor</label>
        <input id="setupCode" name="setupCode" type="password" autocomplete="off">
      </div>

      <button class="auth-button" type="submit">Criar conta interna</button>
    </form>

    <div class="auth-links">
      <a href="/auth/entrar.html?area=staff">Ja tenho conta de funcionario/dev</a>
      <a href="/">Voltar ao site</a>
    </div>
  </main>

  <script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
