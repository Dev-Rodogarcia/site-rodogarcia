<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Carrosseis | Rodogarcia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-brand">
      <strong>Rodogarcia Admin</strong>
      <span id="session-user"></span>
    </div>

    <nav class="admin-nav" aria-label="Navegacao administrativa">
      <a href="/admin/index.html">Painel</a>
      <a href="/admin/carrosseis.html" aria-current="page">Carrosseis</a>
      <a href="/admin/vagas.html">Vagas</a>
      <button id="logout-btn" type="button">Sair</button>
    </nav>
  </header>

  <main class="admin-main">
    <p id="panel-message" class="panel-message" aria-live="polite"></p>

    <section class="admin-grid">
      <article class="admin-card">
        <h2>Carrossel Hero</h2>
        <form id="hero-form" class="admin-form" novalidate>
          <input type="hidden" id="heroId" name="heroId">

          <label>
            Titulo
            <input id="heroTitle" name="heroTitle" type="text" required maxlength="120">
          </label>

          <label>
            Descricao
            <textarea id="heroDescription" name="heroDescription" required maxlength="420"></textarea>
          </label>

          <label>
            URL da imagem
            <input id="heroImage" name="heroImage" type="url" required>
          </label>

          <div class="form-grid-2">
            <label>
              Botao 1 texto
              <input id="heroBtn1Text" name="heroBtn1Text" type="text" maxlength="40">
            </label>
            <label>
              Botao 1 URL
              <input id="heroBtn1Url" name="heroBtn1Url" type="url">
            </label>
          </div>

          <label class="check-row">
            <input id="heroBtn1Enabled" name="heroBtn1Enabled" type="checkbox">
            Ativar botao 1
          </label>

          <div class="form-grid-2">
            <label>
              Botao 2 texto
              <input id="heroBtn2Text" name="heroBtn2Text" type="text" maxlength="40">
            </label>
            <label>
              Botao 2 URL
              <input id="heroBtn2Url" name="heroBtn2Url" type="url">
            </label>
          </div>

          <label class="check-row">
            <input id="heroBtn2Enabled" name="heroBtn2Enabled" type="checkbox">
            Ativar botao 2
          </label>

          <label class="check-row">
            <input id="heroActive" name="heroActive" type="checkbox" checked>
            Slide ativo
          </label>

          <div class="form-actions">
            <button class="btn-primary" type="submit">Salvar slide</button>
            <button class="btn-secondary" type="button" id="hero-clear-btn">Limpar</button>
          </div>
        </form>
      </article>

      <article class="admin-card">
        <h3>Slides Hero</h3>
        <ul id="hero-list" class="admin-list"></ul>
      </article>
    </section>

    <section class="admin-grid">
      <article class="admin-card">
        <h2>Carrossel DNA</h2>
        <form id="dna-form" class="admin-form" novalidate>
          <input type="hidden" id="dnaId" name="dnaId">

          <label>
            Titulo
            <input id="dnaTitle" name="dnaTitle" type="text" required maxlength="120">
          </label>

          <label>
            Texto
            <textarea id="dnaText" name="dnaText" required maxlength="420"></textarea>
          </label>

          <label>
            URL da imagem
            <input id="dnaImage" name="dnaImage" type="url" required>
          </label>

          <label class="check-row">
            <input id="dnaActive" name="dnaActive" type="checkbox" checked>
            Slide ativo
          </label>

          <div class="form-actions">
            <button class="btn-primary" type="submit">Salvar slide</button>
            <button class="btn-secondary" type="button" id="dna-clear-btn">Limpar</button>
          </div>
        </form>
      </article>

      <article class="admin-card">
        <h3>Slides DNA</h3>
        <ul id="dna-list" class="admin-list"></ul>
      </article>
    </section>
  </main>

  <script type="module" src="/assets/js/admin-carousels.js"></script>
</body>
</html>
